name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile all modules
        run: >-
          python -m py_compile
          web_app.py wechat_analyzer.py ai_topic_analyzer.py search_provider.py
          account_profile.py wechat_index_ai.py wechat_index_store.py wechat_index_excel.py

      - name: Event dedup regression tests
        run: python -m unittest test_wechat_index_dedup -v
